<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:772px;height:250px;overflow:hidden;position:relative;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(120deg,#11454d 0%,#0c3238 55%,#08242a 100%);color:#fff}
.glow{position:absolute;right:-120px;top:-150px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(46,211,160,.18),rgba(46,211,160,0))}
.brand{position:absolute;left:36px;top:0;height:250px;display:flex;align-items:center;gap:18px}
.brand svg{width:100px;height:91px;flex:none}
h1{margin:0;font-size:46px;line-height:1;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
p{margin:12px 0 0;font-size:19px;line-height:1.35;color:#bfe3dc;font-weight:500}
.card{position:absolute;left:544px;top:39px;width:196px;background:#fff;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:8px 16px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid #e6e8ee}
.row:last-child{border-bottom:0}
.b{font-size:12px;font-weight:700;line-height:1;padding:5px 7px;border-radius:4px;min-width:76px;text-align:center;box-sizing:border-box}
.create{color:#00701a;background:#e6f6e9}.update{color:#0a4b78;background:#e5f1fb}.same{color:#50575e;background:#f0f0f1}
.bar{height:10px;border-radius:5px;background:#d5d9e3}
</style>
<div class="glow"></div>
<div class="brand">
  <!--#include mark.svg.inc -->
  <div><h1>Content Relay</h1><p>Push pages and posts<br>from staging to live</p></div>
</div>
<div class="card">
  <div class="row"><span class="b create">Create</span><div class="bar" style="width:72px"></div></div>
  <div class="row"><span class="b update">Update</span><div class="bar" style="width:58px"></div></div>
  <div class="row"><span class="b same">Unchanged</span><div class="bar" style="width:66px"></div></div>
</div>
